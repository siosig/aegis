name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build / Lint / Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - name: Build
        run: pnpm run build

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test
        run: pnpm test
